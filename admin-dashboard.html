<!DOCTYPE html>
<html lang="mr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard - APEX Man Power</title>
    <link rel="icon" type="image/png" href="Apex.logo.png">
    <link rel="stylesheet" href="admin.css">
    <!-- Firebase App & Firestore CDN v10.8.0 -->
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
</head>
<body class="dashboard-body">

    <!-- डावीकडील साइडबार (Left Sidebar) -->
    <div class="sidebar">
        <h2 class="sidebar-logo">APEX <span>ADMIN</span></h2>
        
        <ul class="sidebar-menu">
            <!-- १. Data Dashboard (Dropdown) -->
            <li>
                <button class="dropdown-btn" onclick="toggleDropdown()">
                    📊 Data Dashboard <span class="arrow">&#9660;</span>
                </button>
                <ul class="dropdown-container" id="dataDropdown">
                    <li><a href="#">↳ Client Application</a></li>
                    <li><a href="#" onclick="showWorkerTable(event)">↳ Worker Application</a></li>
</ul>
            </li>

            <!-- २. Activity and Audit Logs -->
            <li>
                <a href="#" class="menu-link">📝 Activity & Audit Logs</a>
            </li>
            <!-- ३. Security & Audit Logs (डिव्हाइस इन्फो, लोकेशन आणि ॲक्टिव्ह टाईम) -->
            <li>
                <a href="#" class="menu-link">🛡️ Security & Audit Logs</a>
            </li>
        </ul>

        <!-- लॉगआउट बटन -->
        <a href="admin-login.html" class="logout-btn">Logout</a>
    </div>

    <!-- उजवीकडील मुख्य भाग (Main Content Area) -->
    <div class="main-content">
        <header class="dashboard-header">
            <h2>Dashboard</h2>
            <div class="admin-profile">👤 Admin</div>
        </header>

        <div class="content-area" style="display: none;">
            <h3>Worker Applications</h3>
            <div style="overflow-x: auto; margin-top: 20px;">
                <table border="1" style="width: 100%; border-collapse: collapse; text-align: left; background: white;">
                    <thead>
                        <tr style="background-color: #0b2545; color: white;">
                            <th style="padding: 10px;">Reg. No</th>
                            <th style="padding: 10px;">Full Name</th>
                            <th style="padding: 10px;">Mobile</th>
                            <th style="padding: 10px;">Age Category</th>
                            <th style="padding: 10px;">UTR Number</th>
                            <th style="padding: 10px;">Date</th>
                            <th style="padding: 10px;">Status</th>
                            <th style="padding: 10px;">Action</th>
                        </tr>
                    </thead>
                    <tbody id="adminTableBody">
                        <!-- फायरबेसवरून डेटा इथे ऑटोमॅटिक येईल -->
                    </tbody>
                </table>
            </div>
        </div>

    <!-- ड्रॉपडाऊन मेनू उघडण्यासाठी JavaScript -->
    <!-- ड्रॉपडाऊन मेनू उघडण्यासाठी JavaScript -->
    <script>
        function toggleDropdown() {
            var dropdown = document.getElementById("dataDropdown");
            if (dropdown.style.display === "block") {
                dropdown.style.display = "none";
            } else {
                dropdown.style.display = "block";
            }
        }
    </script>

    <!-- ॲडमिन डॅशबोर्डसाठी रिअल-टाइम डेटा फेच करण्याचे लॉजिक -->
    <script>
        // तुमच्या दिलेल्या API Key सह Firebase सुरू करणे
        const firebaseConfig = {
            apiKey: "AIzaSyDxgRYIMKTpI0KFnECRBsi4AJraBglFo90",
            authDomain: "apex-245ed.firebaseapp.com",
            projectId: "apex-245ed",
            storageBucket: "apex-245ed.firebasestorage.app",
            messagingSenderId: "1082704594683",
            appId: "1:1082704594683:web:5c1c67afeb0eadfb68d25e"
        };

        // Firebase इनिशिअलाइज करणे
        if (!firebase.apps.length) {
            firebase.initializeApp(firebaseConfig);
        }
        const db = firebase.firestore();

        // ॲडमिन डॅशबोर्डवर डेटा लोड करण्यासाठी फंक्शन
        // ॲडमिन डॅशबोर्डवर डेटा लोड करण्यासाठी आणि एक्सपांडबल रो बनवण्यासाठी फंक्शन
        function loadWorkerApplications() {
            let tableBody = document.getElementById('adminTableBody');
            
            db.collection("workers").orderBy("registrationDate", "desc").onSnapshot((snapshot) => {
                if(tableBody) tableBody.innerHTML = ""; 
                
                snapshot.forEach((doc) => {
                    let data = doc.data();
                    let docId = doc.id;
                    
                    // १. मुख्य रो (ज्यावर क्लिक केल्यावर माहिती दिसेल)
                    let mainRow = `<tr>
                        <!-- हा नवीन डेटा कॉलम ॲड केला -->
                        <td style="padding: 10px; font-weight: bold; color: #ff6600;">
                            ${data.regNo || 'Pending'}
                        </td>
                        <td style="padding: 10px;">
                            <span style="color: #0b2545; font-weight: bold; cursor: pointer; text-decoration: underline;" onclick="toggleDetails('${docId}')">
                                ${data.fullName || 'N/A'}
                            </span>
                        </td>
                        <td style="padding: 10px;">${data.mobileNumber || ''}</td>
                        <td style="padding: 10px;">${data.ageCategory || ''}</td>
                        <td style="padding: 10px;">${data.utrNumber || ''}</td>
                        <td style="padding: 10px;">${data.registrationDate || ''}</td>
                        <td style="padding: 10px;"><span style="color: green; font-weight: bold;">${data.status || 'Pending'}</span></td>
                        <td style="padding: 10px;">
                            <button class="view-btn" onclick="toggleDetails('${docId}')">View Details</button>
                            <button onclick="deleteWorker('${docId}')" style="background-color: #d32f2f; color: white; border: none; padding: 6px 12px; border-radius: 4px; cursor: pointer; font-weight: bold; margin-left: 5px;">Delete</button>
                        </td>
                    </tr>`;
                    
                    // २. एक्सपांड होणारी तपशीलवार रो (Accordion Details Box)
                    // २. एक्सपांड होणारी तपशीलवार रो (A to Z माहिती, फोटो आणि डॉक्युमेंट्ससह)
                    let detailsRow = `<tr id="details-${docId}" class="details-row">
                        <td colspan="8" style="padding: 0;">
                            <div style="display: grid; grid-template-columns: auto 1fr 1fr; gap: 20px; padding: 20px; border-left: 4px solid #ff6600; background: #fafafa; font-size: 14px; color: #0b2545;">
                                
                                <!-- १. प्रोफाइल फोटो आणि रोल -->
                                <div style="text-align: center; border-right: 1px solid #ddd; padding-right: 20px;">
                                    <img src="${data.profilePhoto || 'https://via.placeholder.com/100?text=No+Photo'}" alt="Profile" style="width: 100px; height: 100px; border-radius: 50%; border: 3px solid #0b2545; object-fit: cover;">
                                    <h4 style="margin: 10px 0 5px 0; color: #ff6600;">${data.userRole ? data.userRole : data.ageCategory}</h4>
                                </div>
                                
                                <!-- २. वैयक्तिक माहिती -->
                                <div>
                                    <p style="margin:5px 0;"><strong>Gender:</strong> ${data.gender || '-'}</p>
                                    <p style="margin:5px 0;"><strong>Caste:</strong> ${data.casteCategory || '-'}</p>
                                    <p style="margin:5px 0;"><strong>Marital Status:</strong> ${data.maritalStatus || '-'}</p>
                                    <p style="margin:5px 0;"><strong>DOB:</strong> ${data.dob || '-'} (${data.age || '-'})</p>
                                    <p style="margin:5px 0;"><strong>Adharcard Link Mob:</strong> ${data.aadhaarMobile || '-'}</p>
                                    <p style="margin:5px 0;"><strong>Address:</strong> ${data.address || '-'}, ${data.village || ''}, ${data.taluka || ''}, ${data.district || ''}</p>
                                </div>
                                
                                <!-- ३. शिक्षण, काम आणि डॉक्युमेंट्स -->
                                <div>
                                    ${data.penNumber ? `<p style="margin:5px 0;"><strong>PEN Number:</strong> ${data.penNumber}</p>` : ''}
                                    ${data.standard ? `<p style="margin:5px 0;"><strong>Education:</strong> ${data.standard}</p>` : ''}
                                    ${data.workType ? `<p style="margin:5px 0;"><strong>Work Type:</strong> ${data.workType === 'Other' ? data.otherWork : data.workType}</p>` : ''}
                                    ${data.employmentType ? `<p style="margin:5px 0;"><strong>Emp Type:</strong> ${data.employmentType}</p>` : ''}
                                    ${data.expYears ? `<p style="margin:5px 0;"><strong>Experience:</strong> ${data.expYears} Years</p>` : ''}
                                    
                                    <!-- अपलोड केलेले डॉक्युमेंट्स (बटनसह) -->
                                    <div style="margin-top: 15px; padding: 12px; background: #e3f2fd; border-radius: 6px; border: 1px dashed #2196f3;">
                                        <strong style="color: #0b2545;">Attached Documents:</strong><br>
                                        <div style="margin-top: 10px; display: flex; flex-wrap: wrap; gap: 10px;">
                                            
                                            ${data.aadhaarDocUrl ? `<a href="${data.aadhaarDocUrl}" target="_blank" style="padding: 6px 12px; background: #0b2545; color: white; text-decoration: none; border-radius: 4px; font-size: 13px; font-weight: bold;">👁️ View Aadhaar</a>` : (data.hasAadhaarDoc ? '<span style="color: #d35400; font-size: 13px;">✅ Aadhaar (File Not Uploaded)</span>' : '')}
                                            
                                            ${data.consentDocUrl ? `<a href="${data.consentDocUrl}" target="_blank" style="padding: 6px 12px; background: #0b2545; color: white; text-decoration: none; border-radius: 4px; font-size: 13px; font-weight: bold;">👁️ View Consent</a>` : (data.hasConsentDoc ? '<span style="color: #d35400; font-size: 13px;">✅ Consent (File Not Uploaded)</span>' : '')}
                                            
                                            ${data.licenseDocUrl ? `<a href="${data.licenseDocUrl}" target="_blank" style="padding: 6px 12px; background: #0b2545; color: white; text-decoration: none; border-radius: 4px; font-size: 13px; font-weight: bold;">👁️ View License</a>` : (data.hasLicenseDoc ? '<span style="color: #d35400; font-size: 13px;">✅ License (File Not Uploaded)</span>' : '')}
                                            
                                            ${(!data.hasAadhaarDoc && !data.hasConsentDoc && !data.hasLicenseDoc && !data.aadhaarDocUrl && !data.consentDocUrl && !data.licenseDocUrl) ? '<span style="color: red; font-size: 13px;">❌ No Documents Attached</span>' : ''}
                                            
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </td>
                    </tr>`;
                    
                    if(tableBody) {
                        tableBody.innerHTML += mainRow + detailsRow;
                    }
                });
            });
        }

        // पेज लोड झाल्यावर डॅशबोर्ड डेटा फंक्शन कॉल करणे
        window.onload = function() {
        };
        // अर्ज डिलीट करण्याचे फंक्शन
        function deleteWorker(docId) {
            if (confirm("⚠️Are you sure you want to delete this application?")) {
                db.collection("workers").doc(docId).delete().then(() => {
                    alert("🗑️ Application deleted successfully!");
                }).catch((error) => {
                    console.error("Error removing document: ", error);
                    alert("❌ Error: Failed to delete the application.");
                });
            }
        }
        // युजरने मेनूमैधून 'Worker Application' वर क्लिक केल्यावरच टेबल दिसेल आणि डेटा लोड होईल
        function showWorkerTable(event) {
            event.preventDefault(); // पेज रीफ्रेश होण्यापासून थांबवणे
            
            // टेबल असलेली मुख्य जागा (Content Area) दाखवणे
            let contentArea = document.querySelector('.content-area');
            contentArea.style.display = "block";
            
            // डेटा लोड करणारी फंक्शन कॉल करणे
            loadWorkerApplications();
        }
        // कामगाराची संपूर्ण माहिती खाली उघडणे किंवा बंद करणे (Toggle Function)
        function toggleDetails(docId) {
            let detailsRow = document.getElementById(`details-${docId}`);
            if (detailsRow) {
                if (detailsRow.style.display === "table-row") {
                    detailsRow.style.display = "none";
                } else {
                    detailsRow.style.display = "table-row";
                }
            }
        }
    </script>
</body>
</html>
